<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Registro y monitoreo de signos vitales y orina del paciente"
    />
    <!-- Sin conexion: el tema se aplica antes de pintar para evitar parpadeos. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('msv:ajustes')
          var modo = t ? JSON.parse(t).tema : null
          if (modo !== 'claro' && modo !== 'oscuro') {
            modo = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'oscuro'
              : 'claro'
          }
          document.documentElement.classList.toggle('dark', modo === 'oscuro')
        } catch (e) {}
      })()
    </script>
    <title>Signos Vitales</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
